plugins { id 'com.android.application' }
android {
    namespace 'com.mpay.wallet'
    compileSdk 34
    defaultConfig {
        applicationId 'com.mpay.wallet'
        minSdk 30
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    def signingFile = rootProject.file('.signing/signing.properties')
    if (signingFile.exists()) {
        def signingValues = new Properties()
        signingFile.withInputStream { signingValues.load(it) }
        signingConfigs {
            release {
                storeFile rootProject.file(signingValues['storeFile'])
                storePassword signingValues['storePassword']
                keyAlias signingValues['keyAlias']
                keyPassword signingValues['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }
}
dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.core:core:1.13.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestCompileOnly files("${android.sdkDirectory}/platforms/android-${android.compileSdk}/optional/android.test.runner.jar", "${android.sdkDirectory}/platforms/android-${android.compileSdk}/optional/android.test.base.jar")
}
